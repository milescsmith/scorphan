[project]
name = "scorphan"
version = "0.15.1"
description = "Collection of orphan helper fuctions for single cell omics data analysis"
authors = [
    {name = "Miles Smith", email = "miles-smith@omrf.org"},
]
dependencies = [
    "numpy>=2.0,<2.3",
    "scipy>=1.15.1",
    "mudata>=0.3.1",
    "muon>=0.1.7",
    "scanpy>=1.10.4",
    "numba>=0.60.0,<0.62.0",
    "loguru>=0.7.3",
    "gseapy>=1.1.3",
    "pandas>=2.2.3",
    "sparse>=0.17.0",
    "matplotlib>=3.9.1.post1",
    "networkx>=3.3",
    "rich>=13.9.4",
    "more-itertools>=10.4.0",
    "umap-learn>=0.5.7",
    "h5py>=3.14.0",
    "polars>=1.30",
    "formulaic>=1.2.1",
    "formulaic-contrasts>=1.0.0",
    "pydeseq2>=0.5.3",
    "decoupler>=2.1.2",
    "liana>=1.6.1",
    "omnipath>=1.0.12",
    "bioframe>=0.8.0",
    "msgspec>=0.20.0",
    "scvi-tools>=1.4.2",
    "delayed-import>=0.1.0",
]
requires-python = ">=3.12,<=3.14"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["uv_build>=0.7.0,<0.11.0"]
build-backend = "uv_build"

[project.urls]
Documentation = "https://readthedocs.org"
Repository = "https://github.com/milescsmith/scorphan.git"
Issues = "https://github.com/milescsmith/scorphan/issues"
Changelog = "https://github.com/milescsmith/scorphan/blob/main/CHANGELOG.md"

[project.optional-dependencies]
gpu_cuda12 = ["cupy-cuda12x; sys_platform != 'macos'", "rapids-singlecell[rapids12]>=0.13.4; sys_platform != 'macos'"]
gpu_cuda13 = ["cupy-cuda13x; sys_platform != 'macos'", "rapids-singlecell[rapids13]>=0.13.4; sys_platform != 'macos'"]

[tool.uv]
conflicts = [
    [
        { extra = "gpu_cuda12" },
        { extra = "gpu_cuda13" }
    ]
]

[dependency-groups]
dev = [
  {include-group = "linting"},
  {include-group = "docs"},
  {include-group = "tests"},
]
linting = [
    "ruff>=0.9.2",
    "pandas-stubs>=2.2.3.250527",
    "types-seaborn>=0.13.2.20250516",
    "ty>=0.0.1a16",
]
experiment = [
    "ipython>=9.7.0",
    "ipywidgets>=8.1.8",
    "jupyter-ruff>=0.3.0",
    "jupyterlab>=4.4.10",
    "jupyterlab-execute-time>=3.2.0",
    "stackprinter>=0.2.12",
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-autodoc-typehints>=3.9.8",
    "sphinxcontrib-napoleon>=0.7",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-datatables>=1.0.0",
]
tests = [
    "nox>=2024.10.09",
    "pre-commit>=4.1.0",
]

[tool.basedpyright]
include = ["src"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs"
]
ignore = ["data/", "tests/"]
defineConstant = { DEBUG = true }
# stubPath = "src/stubs"

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.12"
pythonPlatform = "Linux"

executionEnvironments = [
    { root = "src" }
]

typeCheckingMode = "standard"
strictListInference = true
strictDictionaryInference = true
analyzeUnannotatedFunctions = false
