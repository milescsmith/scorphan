[project]
name = "scorphan"
version = "0.10.0"
description = "Collection of orphan helper fuctions for single cell omics data analysis"
authors = [
    {name = "Miles Smith", email = "miles-smith@omrf.org"},
]
dependencies = [
    "numpy>=2.0.2",
    "scipy>=1.15.1",
    "mudata>=0.3.1",
    "muon>=0.1.7",
    "scanpy>=1.10.4",
    "numba>=0.59.0",
    "loguru>=0.7.3",
    "gseapy>=1.1.3",
    "pandas>=2.2.3",
    "sparse>=0.17.0",
    "matplotlib>=3.9.1.post1",
    "networkx>=3.3",
    "rich>=13.9.4",
    "more-itertools>=10.4.0",
    "umap-learn>=0.5.7",
    "h5py>=3.14.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]

[tool.pdm]
distribution = true


[dependency-groups]
dev = [
    "ruff>=0.9.2",
    "nox>=2024.10.09",
    "pre-commit>=4.1.0",
    "pandas-stubs>=2.2.3.250527",
    "types-seaborn>=0.13.2.20250516",
    "ty>=0.0.1a16",
]
