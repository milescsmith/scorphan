repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-ast
      - id: check-case-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-toml
      - id: check-merge-conflict
      - id: fix-byte-order-marker